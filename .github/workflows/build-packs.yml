# Quarterly POI pack build. Single sequential job: all 47 phase-1 areas fit
# comfortably in the 6h cap (measured: Southend end-to-end ~20s; borough
# site-stages single-digit minutes). Split into a matrix only if this
# ever approaches the cap. All sources are keyless: no secrets needed.
name: build-packs

on:
  schedule:
    - cron: '0 0 1 */3 *'   # quarterly, 1st of Jan/Apr/Jul/Oct
  workflow_dispatch:
    inputs:
      spider:
        description: 'Run first-party site spider (phase 1b+)'
        type: boolean
        default: false
      areas:
        description: 'Space-separated area ids (default: all)'
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      # write is load-bearing: the dead-domain cache step commits+pushes
      # learned corpses back to the repo (read-only token 403s the push).
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: pip install duckdb
      - name: Build packs
        # NOTE: GitHub runs each step with bash -e, so a bare failing command
        # would abort the remaining areas. Failures are collected to
        # failed.txt instead; the completeness check at the end fails loudly.
        run: |
          rm -f failed.txt
          run_area() {
            python3 scripts/pack/build.py --area "$1" $2 || echo "$1" >> failed.txt
          }
          # Phase 1b scope (agreed): full spider incl. OSM/ATP-covered POIs
          # (--sites-all) for conflict/specificity signals, not residual-only.
          if [ -n "${{ inputs.areas }}" ]; then
            for a in ${{ inputs.areas }}; do
              run_area "$a" "${{ inputs.spider && '--sites-all' || '' }}"
            done
          else
            python3 scripts/pack/build.py --all ${{ inputs.spider && '--sites-all' || '' }}
          fi
          if [ -s failed.txt ]; then echo "FAILED AREAS:"; cat failed.txt; fi
          true
      - name: Manifest
        if: always()
        run: python3 scripts/pack/build.py --manifest
      - name: Commit dead-domain cache
        if: always()
        run: |
          git config user.name "pack-builder"
          git config user.email "pack-builder@users.noreply.github.com"
          mkdir -p data/dead-domains
          git add data/dead-domains/ || true
          git diff --cached --quiet || (git commit -m "pack builder: dead-domain cache [skip ci]" && git push) || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packs
          path: packs/
          retention-days: 30
      - name: Check completeness
        if: always()
        run: |
          if [ -s failed.txt ]; then
            echo "## Failed areas" >> $GITHUB_STEP_SUMMARY
            cat failed.txt >> $GITHUB_STEP_SUMMARY
            echo "re-run with these ids in the areas input"
            exit 1
          fi
          echo "all dispatched areas completed"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create needs this; default token is read-only
    # Publish-on-partial: green packs bank every run (union keeps the rest),
    # so stormy cycles still move the release forward. Loudness is preserved:
    # the build job still fails on incomplete areas. Cancelled runs publish
    # nothing (a cancellation means "stop everything").
    if: (github.event_name == 'schedule' || github.event.inputs.spider == 'true') && (needs.build.result == 'success' || needs.build.result == 'failure')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packs
          path: packs/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Assemble release assets
        env:
          AREAS_INPUT: ${{ inputs.areas }}
        run: |
          TAG="pois-$(date +%Y)-Q$(( ( $(date +%-m) - 1 ) / 3 + 1 ))"
          echo "TAG=$TAG" >> $GITHUB_ENV
          # Union with the published manifest so single-area dispatches
          # refresh their own packs without orphaning the others (missing
          # base = first release of the quarter; release.py handles that).
          curl -sL -o /tmp/base-manifest.json "https://github.com/${{ github.repository }}/releases/download/$TAG/manifest.json" || true
          BASE=""; [ -s /tmp/base-manifest.json ] && BASE="--base-manifest /tmp/base-manifest.json"
          python3 scripts/pack/release.py --tag "$TAG" --out dist/ $BASE
          # Failed-area transparency: dispatched areas missing from the fresh
          # manifest keep their previous vintage; name them in the notes.
          python3 - <<'EOF' > /tmp/failed-areas.txt
          import json
          import os
          areas = json.load(open('scripts/pack/areas.json'))
          filt = os.environ.get('AREAS_INPUT', '').split()
          dispatched = filt or list(areas)
          fresh = {p['id'] for p in json.load(open('dist/manifest.json'))['packs']}
          missing = [a for a in dispatched if a not in fresh]
          if missing:
              print(' '.join(missing))
          EOF
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent: a re-dispatch in the same quarter refreshes the tag's
        # assets instead of failing on the duplicate tag.
        run: |
          NOTES="Quarterly POI packs. See manifest.json for provenance per pack (per-pack built_at = last verified)."
          if [ -s /tmp/failed-areas.txt ]; then
            NOTES="$NOTES Not yet refreshed this cycle (previous vintage stands): $(cat /tmp/failed-areas.txt)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "$NOTES"
          fi
